<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Behind The Booth Entertainment LLC</title>
    <meta name="theme-color" content="#05080E">
    <link rel="icon" type="image/png" href="assets/icon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #05080E;
            color: #F3F4F6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow: hidden;
        }
        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -30%; left: 40%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%; right: 30%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .content { position: relative; z-index: 1; max-width: 520px; }
        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 800;
            background: linear-gradient(135deg, #C084FC 0%, #A855F7 50%, #7C3AED 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            color: #9CA3AF;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-home {
            display: inline-block;
            padding: 14px 36px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            color: #05080E;
            background: linear-gradient(135deg, #F8E7A1 0%, #D4AF37 50%, #AA7C11 100%);
            border-radius: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="error-code">404</div>
        <h1>This page doesn't exist</h1>
        <p>Looks like you've wandered off the dance floor. The page you're looking for can't be found.</p>
        <a href="/" class="btn-home">Back to the Booth</a>
    </div>
</body>
</html>
